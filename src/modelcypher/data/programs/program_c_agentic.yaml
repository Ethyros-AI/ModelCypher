# Program C - Qwen-Centric Stack (Apache-2.0 only)
#
# Optimized for same-tokenizer donor compatibility within the Qwen ecosystem.
# Focus on code, long-context, and general reasoning capabilities.
# All models are Apache-2.0 licensed for unrestricted redistribution.
#
# Best for: Users who want maximum tokenizer compatibility and strong
# code/math/reasoning coverage in the Qwen architecture family.

_schema: "mc.program.transplant.v1"
name: "Program C - Qwen-Centric"
description: |
  Qwen-centric donor stack optimized for tokenizer compatibility.
  Best same-tokenizer donor set for code, long-context, and general reasoning.

bases:
  # Apache-2.0 base with strong instruction following
  - id: "qwen3-8b"
    source: "Qwen/Qwen3-8B"
    alias: "qwen3"

  # IBM Granite as alternative base (Apache-2.0)
  - id: "granite-8b"
    source: "ibm-granite/granite-3.3-8b-instruct"
    alias: "granite"

donors:
  # Frontier agent donor (MIT) - applied first for agentic geometry
  - id: "deepseek-v3"
    source: "deepseek-ai/DeepSeek-V3.2"
    domains:
      - "reasoning"
      - "logical"
    priority: 4

  # Large Qwen teacher (Apache-2.0) - massive reasoning capability
  - id: "qwen3-235b"
    source: "Qwen/Qwen3-235B-A22B-Instruct"
    domains:
      - "reasoning"
      - "logical"
    priority: 3

  # Coding specialist - same tokenizer (Apache-2.0)
  - id: "qwen-coder"
    source: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    domains:
      - "coding"
    priority: 2

  # Math specialist - same tokenizer (Apache-2.0)
  - id: "qwen-math"
    source: "Qwen/Qwen2.5-Math-7B-Instruct"
    domains:
      - "mathematical"
    priority: 1

  # Medical specialist (Apache-2.0)
  - id: "huatuogpt"
    source: "FreedomIntelligence/HuatuoGPT-o1-7B"
    domains:
      - "factual"
    priority: 0

  # Legal specialist (MIT) - best permissive legal donor
  - id: "saul-7b"
    source: "Equall/Saul-7B-Instruct-v1"
    domains:
      - "logical"
    priority: 0

evaluation:
  after_each_donor: true
  after_program_complete: true
  benchmarks:
    - "mmlu_pro"
    - "gpqa_diamond"
    - "ifeval"
  smoke_test_prompts:
    - "What is 15 * 17?"
    - "Explain the Fibonacci sequence in one sentence."
    - "Write a Python function that reverses a string."
    - "Call the get_weather function for San Francisco."
    - "Parse this JSON and extract the user's name: {\"user\": {\"name\": \"Alice\"}}"

output:
  base_dir: "~/.modelcypher/merged/program-C"
