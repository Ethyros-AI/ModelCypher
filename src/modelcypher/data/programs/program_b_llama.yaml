# Program B - Mistral-Centric Stack (Apache-2.0 only)
#
# Optimized for same-tokenizer donor compatibility within the Mistral ecosystem.
# All models are Apache-2.0 licensed for unrestricted redistribution.
#
# Best for: Users who want maximum tokenizer compatibility and strong
# law/medical/code/math coverage in the Mistral architecture family.

_schema: "mc.program.transplant.v1"
name: "Program B - Mistral-Centric"
description: |
  Mistral-centric donor stack optimized for tokenizer compatibility.
  Strongest permissive law+medical+code+math coverage in Mistral space.

bases:
  # Apache-2.0 base with reasoning post-training
  - id: "ministral-8b"
    source: "mistralai/Ministral-3-8B-Reasoning-2512"
    alias: "ministral"

donors:
  # Frontier agent donor (MIT) - applied first for agentic geometry
  - id: "deepseek-v3"
    source: "deepseek-ai/DeepSeek-V3.2"
    domains:
      - "reasoning"
      - "logical"
    priority: 4

  # Alternative agentic donor (MIT)
  - id: "glm-4.5"
    source: "zai-org/GLM-4.5-Air"
    domains:
      - "reasoning"
      - "coding"
    priority: 4

  # Large Mistral teacher (Apache-2.0)
  - id: "mistral-large"
    source: "mistralai/Mistral-Large-3-675B-Instruct-2512"
    domains:
      - "reasoning"
      - "logical"
    priority: 3

  # Coding specialist - same tokenizer (Apache-2.0)
  - id: "devstral"
    source: "mistralai/Devstral-Small-2507"
    domains:
      - "coding"
    priority: 2

  # Math specialist - same tokenizer (Apache-2.0)
  - id: "mathstral"
    source: "mistralai/Mathstral-7B"
    domains:
      - "mathematical"
    priority: 1

  # Medical specialist (Apache-2.0)
  - id: "biomistral"
    source: "BioMistral/BioMistral-7B"
    domains:
      - "factual"
    priority: 0

  # Legal specialist (MIT) - best permissive legal donor
  - id: "saul-7b"
    source: "Equall/Saul-7B-Instruct-v1"
    domains:
      - "logical"
    priority: 0

evaluation:
  after_each_donor: true
  after_program_complete: true
  benchmarks:
    - "mmlu_pro"
    - "gpqa_diamond"
    - "ifeval"
  smoke_test_prompts:
    - "What is 15 * 17?"
    - "Explain the Fibonacci sequence in one sentence."
    - "Write a Python function that reverses a string."
    - "What are the contraindications for aspirin use?"
    - "What is the difference between civil and criminal liability?"

output:
  base_dir: "~/.modelcypher/merged/program-B"
