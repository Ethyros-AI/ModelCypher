# Program A - Permissive Multi-Specialist (MIT/Apache-2.0 only)
#
# Creates an "uber-dense" 8B model using permissively-licensed donors only.
# All models listed here are verified MIT or Apache-2.0 licensed.
#
# License inheritance: Apache-2.0 (most restrictive component wins).
# The merged model can be freely redistributed under Apache-2.0 terms.

_schema: "mc.program.transplant.v1"
name: "Program A - Permissive Multi-Specialist"
description: |
  Multi-donor transplant into Qwen3/Ministral bases with full domain coverage.
  All donors are MIT or Apache-2.0 licensed for unrestricted redistribution.

bases:
  # Apache-2.0 licensed bases
  - id: "qwen3-8b"
    source: "Qwen/Qwen3-8B"
    alias: "qwen3"

  - id: "ministral-8b"
    source: "mistralai/Ministral-3-8B-Reasoning-2512"
    alias: "ministral"

donors:
  # General reasoning + agentic (highest priority - MIT licensed)
  - id: "deepseek-v3"
    source: "deepseek-ai/DeepSeek-V3.2"
    domains:
      - "reasoning"
      - "logical"
    priority: 3

  # Alternative reasoning donor (MIT licensed)
  - id: "glm-4.5"
    source: "zai-org/GLM-4.5"
    domains:
      - "reasoning"
      - "coding"
    priority: 3

  # Coding specialists (Apache-2.0)
  - id: "devstral-coding"
    source: "mistralai/Devstral-Small-2507"
    domains:
      - "coding"
    priority: 2

  - id: "qwen-coder"
    source: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    domains:
      - "coding"
    priority: 2

  # Math specialists (Apache-2.0)
  - id: "qwen-math"
    source: "Qwen/Qwen2.5-Math-7B-Instruct"
    domains:
      - "mathematical"
    priority: 1

  - id: "mathstral"
    source: "mistralai/Mathstral-7B"
    domains:
      - "mathematical"
    priority: 1

  # Medical domain (Apache-2.0)
  - id: "biomistral"
    source: "BioMistral/BioMistral-7B"
    domains:
      - "factual"
    priority: 0

  - id: "huatuogpt"
    source: "FreedomIntelligence/HuatuoGPT-o1-7B"
    domains:
      - "factual"
    priority: 0

  # Legal domain (MIT)
  - id: "saul-7b"
    source: "Equall/Saul-7B-Instruct-v1"
    domains:
      - "logical"
    priority: 0

evaluation:
  after_each_donor: true
  after_program_complete: true
  benchmarks:
    - "mmlu_pro"
    - "gpqa_diamond"
    - "ifeval"
  smoke_test_prompts:
    - "What is 15 * 17?"
    - "Explain the Fibonacci sequence in one sentence."
    - "Write a Python function that reverses a string."
    - "What are the symptoms of pneumonia?"
    - "What is the statute of limitations for breach of contract?"

output:
  base_dir: "~/.modelcypher/merged/program-A"
