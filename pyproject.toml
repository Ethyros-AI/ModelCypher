[tool.poetry]
name = "modelcypher"
version = "1.0.0"
description = "ModelCypher core engines and CLI for model training and analysis"
authors = ["Jason Kempf <jason@ethyros.ai>"]
readme = "README.md"
license = "AGPL-3.0-only"
homepage = "https://github.com/EthyrosAI/ModelCypher"
repository = "https://github.com/EthyrosAI/ModelCypher"
keywords = ["llm", "machine-learning", "model-merging", "geometry", "manifold", "mlx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "modelcypher", from = "src" }]
include = [
  { path = "src/modelcypher/data/*.json", format = "sdist" },
  { path = "src/modelcypher/data/*.json", format = "wheel" },
]

[tool.poetry.urls]
Documentation = "https://github.com/EthyrosAI/ModelCypher#readme"
Changelog = "https://github.com/EthyrosAI/ModelCypher/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/EthyrosAI/ModelCypher/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
typer = "^0.21.0"
PyYAML = "^6.0.3"
huggingface-hub = "^1.2.3"
mlx-lm = { version = "^0.30.0", markers = "platform_system == 'Darwin'" }
numpy = ">=2.0.0,<2.3.0"
scipy = "^1.16.3"
psutil = "^7.2.1"
safetensors = "^0.7.0"
tokenizers = "^0.22.1"
mlx-embeddings = { version = "^0.0.5", optional = true }
mlx-vlm = { version = "^0.3.9", markers = "platform_system == 'Darwin'", optional = true }

pypdf = { version = "^6.5.0", optional = true }
python-docx = { version = "^1.2.0", optional = true }
beautifulsoup4 = { version = "^4.14.3", optional = true }
openpyxl = { version = "^3.1.5", optional = true }
python-pptx = { version = "^1.0.2", optional = true }
torch = { version = "^2.9.1", optional = true }
jax = { version = "^0.8.2", optional = true }
jaxlib = { version = "^0.8.2", optional = true }
scikit-learn = "^1.8.0"
lm-eval = "^0.4.9.2"
plotly = { version = "^6.5.0", optional = true }
tenacity = "^9.1.2"
xxhash = "^3.6.0"
mlx = "0.30.3"
pillow = "^12.1.0"
matplotlib = "^3.10.8"
openai-whisper = "^20250625"
gwpy = "^3.0.14"
gwosc = "^0.8.1"
geoopt = "^0.5.1"
ripser = "^0.6.14"

[tool.poetry.extras]
docs = ["pypdf", "python-docx", "beautifulsoup4", "openpyxl", "python-pptx"]
cuda = ["torch"]
jax = ["jax", "jaxlib"]
embeddings = ["mlx-embeddings"]
vlm = ["mlx-vlm"]
viz = ["plotly"]

[tool.poetry.scripts]
mc = "modelcypher.cli.app:app"
modelcypher = "modelcypher.cli.app:app"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
hypothesis = "^6.148.11"
pytest-xdist = "^3.8.0"
mypy = "^1.19.1"
pip-audit = "^2.10.0"
types-pyyaml = "^6.0.12.20250915"
types-requests = "^2.32.4.20250913"
astropy = "^7.2.0"
h5py = "^3.15.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["src", ".git", "node_modules", "__pycache__", ".venv", "venv", "build", "dist", ".hypothesis", "_archive"]
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests that load models or touch filesystem",
    "slow: Tests that take more than 1 second",
    "mlx: Tests that require MLX hardware (Apple Silicon)",
    "property: Hypothesis property-based tests",
    "real_model: Tests that load real models from HuggingFace or local paths",
]
# SWIG warnings come from HuggingFace tokenizers (Rust library, external)
filterwarnings = [
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files often have re-exports that look unused
"*/__init__.py" = ["F401"]
# Files with intentional conditional imports (MLX guard, backend selection)
"src/modelcypher/adapters/*" = ["E402"]
"src/modelcypher/core/domain/_backend.py" = ["E402"]
"src/modelcypher/infrastructure/adapters/mlx/*" = ["E402"]
"src/modelcypher/core/domain/geometry/*" = ["E402", "E741"]
"src/modelcypher/core/domain/inference/*" = ["E402"]
"src/modelcypher/viz/*" = ["E402"]
"src/modelcypher/core/use_cases/*" = ["E402", "E741"]
"src/modelcypher/cli/app.py" = ["E402"]
"src/modelcypher/core/domain/safety/*" = ["E741"]
# Test files often have conditional imports and mathematical variable names
"tests/*" = ["E402", "E741", "F401"]
