name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - roadmap-2026-07
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  test-macos-arm64:
    name: macOS arm64 tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest -m "not real_model and not slow" -q

  test-ubuntu-jax:
    name: Ubuntu JAX CPU fallback tests
    runs-on: ubuntu-latest
    env:
      MC_DISABLE_MLX: "1"
      MC_BACKEND: jax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --extras jax
      - name: Run tests
        run: poetry run pytest -m "not real_model and not slow" -q

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run ruff
        run: poetry run ruff check

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --extras jax
      - name: Run mypy
        run: poetry run mypy src/modelcypher

  mlx-lm-latest-compat:
    name: Weekly mlx-lm 0.31.x compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Install latest mlx-lm 0.31.x
        run: poetry run python -m pip install --upgrade "mlx-lm>=0.31,<0.32"
      - name: Run MLX compatibility suites
        run: |
          poetry run pytest \
            tests/test_qwen35_training_compat.py \
            tests/test_mlx_training_adapter_strict.py \
            tests/adapters/test_mlx_training_adapter.py \
            -q
